<!DOCTYPE html>
<html lang="es-CO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página No Encontrada • El Camerino Sports</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body style="background-color: var(--bg-base); min-height: 100vh; display: flex; flex-direction: column;">
    <header class="main-navbar-sticky">
        <div class="editorial-container nav-wrapper">
            <a href="index.html" class="brand-logo-official">
                <img src="img/logo-horizontal-camerino.png" alt="El Camerino Sports" class="brand-logo-img">
            </a>
            <a href="index.html" class="btn btn-secondary-outline" style="font-size: 0.9rem; padding: 0.5rem 1rem;">← Volver al Inicio</a>
        </div>
    </header>

    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 4rem 1.5rem; text-align: center;">
        <div style="max-width: 600px;">
            <span style="font-family: var(--font-heading); font-style: italic; font-size: 6rem; font-weight: 900; color: var(--accent-volt); line-height: 1; display: block; text-shadow: 0 0 25px rgba(166, 255, 0, 0.4);">
                404
            </span>
            <h1 style="font-family: var(--font-heading); font-style: italic; font-size: 2.2rem; margin: 1rem 0 0.75rem; color: #FFFFFF;">
                FUERA DE JUEGO (BALÓN FUERA)
            </h1>
            <p style="color: var(--text-secondary); font-size: 1.05rem; line-height: 1.6; margin-bottom: 2rem;">
                La jugada no prosperó: la página o producto que estás buscando no existe o fue trasladado a otra sección.
            </p>
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <a href="index.html" class="btn btn-primary-volt">
                    ⚡ IR AL CATÁLOGO PRINCIPAL
                </a>
                <a href="index.html#contacto" class="btn btn-secondary-outline">
                    CONTACTAR SOPORTE
                </a>
            </div>
        </div>
    </main>

    <footer style="background-color: var(--bg-surface); border-top: 1px solid var(--border-color); padding: 1.5rem 0; text-align: center; color: var(--text-muted); font-size: 0.85rem;">
        © 2026 EL CAMERINO SPORTS. Todos los derechos reservados. Donde empieza el juego.
    </footer>
</body>
</html>
